[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "zulassungen"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "pandera>=0.20",
    "pydantic>=2.0",
    "py7zr>=0.20",
]

[tool.setuptools.packages.find]
where = ["src"]